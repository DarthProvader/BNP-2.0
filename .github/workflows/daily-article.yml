name: Daily Article Generation

on:
  schedule:
    - cron: '0 4 * * *' # 4:00 UTC = 6:00 CZ (letni cas) / 5:00 CZ (zimni cas)
  workflow_dispatch: # rucni spusteni

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Install Playwright for FutureTools collector
        run: |
          pip install playwright
          playwright install chromium

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write Vertex AI credentials
        if: env.GCP_CREDENTIALS_JSON != ''
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: echo "$GCP_CREDENTIALS_JSON" > scripts/vertexai.json

      - name: Generate daily article
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_DEPLOYMENT_NAME: ${{ secrets.AZURE_DEPLOYMENT_NAME }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          claude -p "Run the full daily pipeline:
          1. cd scripts
          2. Run all collectors: python -m collectors.reddit_collector, python -m collectors.twitter_collector, python -m collectors.youtube_collector, python -m collectors.futuretools_collector
          3. Run article generation: python -m pipeline.run_pipeline --step generate
          4. Run comment generation: python -m pipeline.run_pipeline --step comments
          Activate the venv first if needed. Report what article was generated." \
            --allowedTools Bash,Read,Write,Edit \
            --max-turns 25

      - name: Commit and push
        run: |
          git config user.name "Claude Bot"
          git config user.email "bot@berounampraci.cz"
          git add content/articles/
          if git diff --staged --quiet; then
            echo "No new content to commit"
          else
            git commit -m "Daily article $(date +%Y-%m-%d)

            Generated by Claude Code daily pipeline
            Co-Authored-By: Claude Sonnet <noreply@anthropic.com>"
            git push
          fi
