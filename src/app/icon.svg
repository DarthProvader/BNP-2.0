<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0a0a0a"/>
  <!-- Robot head -->
  <rect x="8" y="8" width="16" height="14" rx="3" fill="none" stroke="#ff6600" stroke-width="2"/>
  <!-- Eyes -->
  <rect x="11" y="12" width="3" height="3" rx="0.5" fill="#ff6600"/>
  <rect x="18" y="12" width="3" height="3" rx="0.5" fill="#ff6600"/>
  <!-- Mouth -->
  <line x1="12" y1="18" x2="20" y2="18" stroke="#ff6600" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="16" y1="8" x2="16" y2="4" stroke="#ff6600" stroke-width="1.5"/>
  <circle cx="16" cy="3.5" r="1.5" fill="#ff6600"/>
  <!-- Ears -->
  <rect x="5" y="12" width="3" height="5" rx="1" fill="#ff6600" opacity="0.6"/>
  <rect x="24" y="12" width="3" height="5" rx="1" fill="#ff6600" opacity="0.6"/>
</svg>
